<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="在手机上识别美团账单截图，计算货物、服务收入净额和合计。">
  <title>美团报税计算器</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <main class="screen">
    <header class="header">
      <h1>美团报税计算器</h1>
      <button id="install" class="install" type="button" hidden>添加到桌面</button>
    </header>

    <section class="upload" aria-labelledby="upload-label">
      <div class="heading">
        <h2 id="upload-label">上传图片</h2>
        <span class="aside">最多 3 张</span>
      </div>
      <div class="slots" id="slots"></div>
      <p id="ocr-preparation" class="status" role="status" hidden></p>
      <button id="ocr-retry" class="secondary" type="button" hidden>重新加载识图组件</button>
    </section>

    <section class="controls" aria-labelledby="controls-label">
      <h2 id="controls-label">报税数据</h2>
      <div class="controls-line">
        <div class="modes" role="group" aria-label="计算方式">
          <button type="button" data-mode="quarter" aria-pressed="true">按季度</button>
          <button type="button" data-mode="month" aria-pressed="false">按月</button>
          <button type="button" data-mode="day" aria-pressed="false">按天</button>
        </div>
        <label class="days">
          <input id="day-count" name="dayCount" type="text" inputmode="numeric" maxlength="3" pattern="[0-9]{1,3}" autocomplete="off" aria-label="账单天数" aria-describedby="days-help">
          <span>天</span>
        </label>
      </div>
      <p id="days-help" class="aside">填写账单覆盖的实际天数</p>
      <button class="primary" id="calculate" type="button">开始计算</button>
      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      <fieldset id="period-review" class="review" hidden>
        <legend>核对账单所属期</legend>
        <p>截图未显示完整所属期，请根据后台账单补齐。</p>
        <div id="period-fields" class="period-fields"></div>
        <button id="confirm-period" class="secondary" type="button">确认并计算</button>
      </fieldset>
    </section>

    <section id="results" class="results" aria-labelledby="result-label" hidden>
      <div class="heading">
        <h2 id="result-label">报税数据</h2>
        <span id="result-period" class="aside"></span>
      </div>
      <div id="result-groups" class="result-groups"></div>
      <p id="result-note" class="aside result-note" hidden></p>
      <div class="result-actions">
        <button id="copy" class="secondary" type="button">复制结果</button>
      </div>
      <p id="copy-status" role="status" aria-live="polite" class="status copy-status" hidden></p>
    </section>
    <noscript><p>请开启 JavaScript 后再使用计算器。</p></noscript>
  </main>
</body>
</html>
